<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Database management system</title>
  <desc id="desc">A database cylinder connected to tables and query panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#061b1c"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="db" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <circle cx="450" cy="470" r="285" fill="#0f172a" opacity=".8"/>
  <ellipse cx="450" cy="310" rx="210" ry="70" fill="#67e8f9"/>
  <path d="M240 310V620C240 660 334 700 450 700C566 700 660 660 660 620V310" fill="url(#db)"/>
  <ellipse cx="450" cy="310" rx="210" ry="70" fill="#a7f3d0" opacity=".85"/>
  <ellipse cx="450" cy="460" rx="210" ry="70" fill="none" stroke="#e0f2fe" stroke-width="5" opacity=".55"/>
  <ellipse cx="450" cy="620" rx="210" ry="70" fill="none" stroke="#e0f2fe" stroke-width="5" opacity=".55"/>
  <g fill="#0f172a" stroke="#94a3b8" stroke-width="4">
    <rect x="90" y="805" width="300" height="145" rx="26"/>
    <rect x="510" y="805" width="300" height="145" rx="26"/>
  </g>
  <g stroke="#5eead4" stroke-width="5" stroke-linecap="round">
    <path d="M300 805L370 680"/>
    <path d="M600 805L530 680"/>
  </g>
  <g fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">
    <text x="130" y="860">SELECT *</text>
    <text x="130" y="900">FROM users;</text>
    <text x="550" y="860">TABLES</text>
    <text x="550" y="900">relations</text>
  </g>
  <text x="90" y="1070" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">DATABASE MANAGEMENT</text>
  <text x="90" y="1120" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="24">schemas, queries, organized data</text>
</svg>
